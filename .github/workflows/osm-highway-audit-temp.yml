name: Temporary OSM secondary inspection

on:
  push:
    branches:
      - routing/osm-highway-audit

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Inspect Nerskogen secondary ways
        run: node --experimental-strip-types scripts/routing/inspectSecondaryWays.temp.ts nerskogen
