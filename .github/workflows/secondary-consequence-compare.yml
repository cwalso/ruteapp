name: Compare secondary routing consequences

on:
  push:
    branches:
      - routing/validate-secondary-consequences
    paths:
      - .github/workflows/secondary-consequence-compare.yml

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Current dataset
        run: npx vitest run tests/routing/secondaryConsequences.test.ts --reporter=verbose

      - name: Dataset before secondary
        shell: bash
        run: |
          git show 5cbb2817bb4aacbb352a025248e652e23cf4ef19:public/data/routing/nerskogen.json > public/data/routing/nerskogen.json
          npx vitest run tests/routing/secondaryConsequences.test.ts --reporter=verbose || true
