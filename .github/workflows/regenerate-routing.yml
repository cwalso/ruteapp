name: Regenerate Nerskogen routing dataset

on:
  push:
    branches:
      - routing/include-secondary-backbone
    paths:
      - scripts/routing/osmWalkingPolicy.ts
      - tests/routing/osmHighwayCoverage.test.ts
      - tests/routing/nerskogenDataset.test.ts
      - .github/workflows/regenerate-routing.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch OSM snapshot
        run: npm run routing:fetch

      - name: Build routing dataset
        run: npm run routing:build

      - name: Verify routing dataset
        shell: bash
        run: |
          set +e
          npm run routing:verify 2>&1 | tee routing-verify.log
          status=${PIPESTATUS[0]}
          echo "VERIFY_STATUS=${status}" >> "${GITHUB_ENV}"
          exit ${status}

      - name: Commit regenerated dataset
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/routing/nerskogen.json
          if git diff --cached --quiet; then
            echo "Routing dataset unchanged"
          else
            git commit -m "Regenerate Nerskogen routing dataset"
            git push
          fi

      - name: Upload regenerated dataset and verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nerskogen-routing-dataset
          path: |
            public/data/routing/nerskogen.json
            routing-verify.log
          if-no-files-found: error
